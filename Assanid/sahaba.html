  <script>
    document.addEventListener("DOMContentLoaded", () => {
        const themeBtn = document.getElementById("btn-theme-toggle");
        const cyElement = document.getElementById("cy");

        if (themeBtn) {
            themeBtn.addEventListener("click", () => {
                document.body.classList.toggle("light-mode");
                
                if (document.body.classList.contains("light-mode")) {
                    themeBtn.innerText = "☀️ الوضع النهاري";
                    // 🌟 تغيير خلفية الشجرة إلى اللون الفاتح
                    if (cyElement) {
                        cyElement.style.background = "radial-gradient(circle at 30% 20%, #fff 100%, #fff 100%)";
                    }
                } else {
                    themeBtn.innerText = "🌙 الوضع الليلي";
                    // 🌟 إعادة الخلفية الداكنة
                    if (cyElement) {
                        cyElement.style.background = "radial-gradient(circle at 30% 20%, #1a2735 0%, #0f1720 70%)";
                    }
                }
            });
        }
    });

document.addEventListener("DOMContentLoaded", () => {
    const exportBtn = document.getElementById("btn-export-pdf");
    const modal = document.getElementById("export-modal");
    const closeModal = document.getElementById("close-export-modal");
    const previewImg = document.getElementById("preview-image");
    const loadingPreview = document.getElementById("loading-preview");
    const confirmBtn = document.getElementById("confirm-export");

    if (!exportBtn) return;

    // 1. فتح نافذة المعاينة
    exportBtn.addEventListener("click", () => {
        modal.style.display = "flex";
        previewImg.style.display = "none";
        loadingPreview.style.display = "block";
        loadingPreview.innerText = "جاري إنشاء المعاينة...";

        const slider = document.getElementById("time-slider-container");
        if (slider) slider.style.display = "none";

        cy.fit(cy.nodes(":visible"), 50);

        setTimeout(() => {
            try {
                // 🌟 تحديد لون الخلفية بناءً على الوضع
                const isLight = document.body.classList.contains("light-mode");
                const bgColor = isLight ? "#ffffff" : "#0f1720";

                // 🌟 استخدام JPEG بدلاً من PNG لتقليل الحجم
                const jpgData = cy.jpg({ 
                    full: true, 
                    scale: 1,       // دقة منخفضة للمعاينة
                    bg: bgColor,
                    quality: 0.8
                });

                previewImg.src = jpgData;
                previewImg.style.display = "block";
                loadingPreview.style.display = "none";
            } catch (err) {
                loadingPreview.innerText = "خطأ في المعاينة: " + err.message;
            }
        }, 300);
    });

    // 2. إغلاق النافذة
    closeModal.addEventListener("click", () => {
        modal.style.display = "none";
        const slider = document.getElementById("time-slider-container");
        if (slider) slider.style.display = "flex";
    });

    // 3. تأكيد التصدير
    confirmBtn.addEventListener("click", () => {
        confirmBtn.innerText = "جاري التصدير...";
        confirmBtn.disabled = true;

        setTimeout(() => {
            try {
                const slider = document.getElementById("time-slider-container");
                if (slider) slider.style.display = "none";

                cy.fit(cy.nodes(":visible"), 50);

                // 🌟 تحديد لون الخلفية بناءً على الوضع
                const isLight = document.body.classList.contains("light-mode");
                const bgColor = isLight ? "#ffffff" : "#0f1720";

                // 🌟 استخدام JPEG بجودة عالية (حجم أصغر)
                const jpgData = cy.jpg({ 
                    full: true, 
                    scale: 2,       // دقة أعلى (2x) ولكن JPEG
                    bg: bgColor,
                    quality: 0.9    // جودة عالية
                });

                const { jsPDF } = window.jspdf;
                const size = document.getElementById("pdf-size").value;
                const orientation = document.getElementById("pdf-orientation").value;

                const pdf = new jsPDF({
                    orientation: orientation,
                    unit: "mm",
                    format: size
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                const imgProps = pdf.getImageProperties(jpgData);
                
                const ratio = Math.min(pdfWidth / imgProps.width, pdfHeight / imgProps.height);
                const imgWidth = imgProps.width * ratio;
                const imgHeight = imgProps.height * ratio;

                const x = (pdfWidth - imgWidth) / 2;
                const y = (pdfHeight - imgHeight) / 2;

                pdf.addImage(jpgData, "JPEG", x, y, imgWidth, imgHeight);
                pdf.save("شجرة_الأسانيد.pdf");

                modal.style.display = "none";
                if (slider) slider.style.display = "flex";

            } catch (err) {
                alert("حدث خطأ أثناء التصدير: " + err.message);
                console.error(err);
            } finally {
                confirmBtn.innerText = "📥 تأكيد التصدير";
                confirmBtn.disabled = false;
            }
        }, 300);
    });
});


    
  </script>
